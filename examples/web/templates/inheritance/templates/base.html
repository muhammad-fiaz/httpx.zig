<!DOCTYPE html>
<html>
<head>
  <title>{{ title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
    header { border-bottom: 1px solid #334155; padding: 1rem 0; margin-bottom: 2rem; }
    header h2 { margin: 0; color: #38bdf8; }
    footer { border-top: 1px solid #334155; padding-top: 1rem; margin-top: 2rem; color: #94a3b8; font-size: 0.9rem; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <header>
    <h2>HTTPX Web Framework</h2>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Powered by HTTPX &amp; Zig 0.16.0</p>
  </footer>
</body>
</html>
