name: Help Wanted
description: Ask a question or request implementation guidance
title: "[Help]: "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Need help? Please check docs first: https://muhammad-fiaz.github.io/httpx.zig/

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
      placeholder: "How do I configure the client pool for concurrent requests?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context / What You Tried
      description: Include code snippets and attempts so far.
      render: zig

  - type: input
    id: zig-version
    attributes:
      label: Zig Version
      description: What version of Zig are you using? (zig version)
      placeholder: 0.17.0
    validations:
      required: true

  - type: input
    id: httpx-version
    attributes:
      label: httpx.zig Version
      description: What version of httpx.zig are you using? (e.g. 0.1.8, main branch commit)
      placeholder: 0.1.8
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
