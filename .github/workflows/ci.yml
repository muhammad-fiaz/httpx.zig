name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format check
        run: zig fmt --check src/ bench/ build.zig build.zig.zon

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig build
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('src/**', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-

      - name: Unit tests
        shell: bash
        run: zig build test --summary all --test-timeout 120s
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

      - name: Run all examples
        shell: bash
        run: zig build run-all-examples
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

      - name: Build (Debug)
        run: zig build -Doptimize=Debug
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

  interop:
    # Real third-party clients against a real server. The unit suite talks to
    # httpx with httpx, so a wire-format or handshake regression that stays
    # self-consistent is invisible to it; curl and openssl are independent
    # implementations, so agreeing with them is actual evidence.
    #
    # Opt-in via HTTPX_INTEROP so the three-OS matrix above stays hermetic and
    # never depends on these binaries being present.
    name: Interop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # X25519MLKEM768 needs OpenSSL 3.5+, and neither runner ships it:
      # macOS provides LibreSSL, Ubuntu 24.04 provides 3.0. The tests detect
      # the capability rather than assume it, so this is about making the
      # post-quantum path reachable at all, not about making the build green.
      - name: Install OpenSSL 3.5 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3.5 || brew install openssl@3
          echo "$(brew --prefix openssl@3.5 2>/dev/null || brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          openssl version

      - name: OpenSSL capabilities
        run: openssl version && (openssl list -kem-algorithms || true)

      - name: Interop tests
        shell: bash
        run: zig build test --summary all --test-timeout 180s
        env:
          HTTPX_INTEROP: '1'
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

  cross-check:
    name: Cross Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 64-bit (glibc)
          - name: x86_64-linux
            target: x86_64-linux
          - name: aarch64-linux
            target: aarch64-linux

          # Linux 32-bit (glibc)
          - name: x86-linux
            target: x86-linux
          - name: arm-linux-gnueabihf
            target: arm-linux-gnueabihf

          # Linux 64-bit (musl)
          - name: x86_64-linux-musl
            target: x86_64-linux-musl
          - name: aarch64-linux-musl
            target: aarch64-linux-musl

          # Linux 32-bit (musl)
          - name: arm-linux-musleabihf
            target: arm-linux-musleabihf

          # macOS
          - name: x86_64-macos
            target: x86_64-macos
          - name: aarch64-macos
            target: aarch64-macos

          # Windows 64-bit
          - name: x86_64-windows
            target: x86_64-windows
          - name: aarch64-windows
            target: aarch64-windows

          # Windows 32-bit
          - name: x86-windows
            target: x86-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig build
        uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-${{ matrix.name }}-${{ hashFiles('src/**', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-${{ matrix.name }}-

      - name: Install cross-compilation deps
        if: contains(matrix.target, 'linux') && !startsWith(matrix.target, 'x86')
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            aarch64-linux*)
              sudo apt-get install -y qemu-user-static
              ;;
            arm-linux-*)
              sudo apt-get install -y qemu-user-static
              ;;
          esac

      - name: Build (Debug)
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=Debug
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

      - name: Build (ReleaseFast)
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
          ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
